# yaml-language-server: $schema=https://www.schemastore.org/api/json/catalog.json
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: ansible-builder
spec:
  description: >-
    Creates a build context (including a Containerfile) from an execution environment spec.
    This build context is populated with dependencies including requirements files.
  workspaces:
    - name: source
      description: The source workspace where the execution environment code is cloned.
    - name: galaxy-gpg-keyring
      description: GPG public keyring for collection signature verification during build.
      optional: true
      readOnly: true
  params:
    - description: Execution environment file definition.
      name: FILENAME
      type: string
      default: execution-environment.yml
    - description: Execution environment build context.
      name: BUILD_CONTEXT
      type: string
      default: context
    - name: OUTPUT_FILENAME
      description: Name of file to write image definition to. Either Dockerfile or Containerfile.
      type: string
      default: Containerfile
    - description: ansible-builder output verbosity.
      name: VERBOSITY
      type: string
      default: "2"
    - name: BUILDER_IMAGE
      description: The location of the ansible-builder image.
      type: string
      default: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
    - name: CONTAINER_POLICY
      description: Podman policy for base image signature validation.
      type: string
      default: "signature_required"
  steps:
    - name: ansible-builder-create
      workingDir: $(workspaces.source.path)
      image: $(params.BUILDER_IMAGE)
      script: |
        #!/bin/sh
        set -eux -o
        if [ "$(workspaces.galaxy-gpg-keyring.bound)" = "true" ]; then
          mkdir -p /etc/ansible/galaxy-keyring
          cp "$(workspaces.galaxy-gpg-keyring.path)"/* /etc/ansible/galaxy-keyring/ 2>/dev/null || true
          export ANSIBLE_GALAXY_GPG_KEYRING=/etc/ansible/galaxy-keyring/pubring.kbx
        fi
        ansible-builder create -f "$(params.FILENAME)" -c "$(params.BUILD_CONTEXT)" \
          --output-filename "$(params.OUTPUT_FILENAME)" \
          --container-policy "$(params.CONTAINER_POLICY)" \
          -v "$(params.VERBOSITY)"
